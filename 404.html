<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Page introuvable · Augmenting Decision</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.ico?v=2027" sizes="32x32">
  <link rel="icon" href="/assets/img/favicon.svg?v=2027" type="image/svg+xml">
  <link rel="icon" href="/favicon-192.png?v=2027" sizes="192x192" type="image/png">
  <!-- Self-contained styles: this page can be served at any URL depth. -->
  <style>
    @font-face { font-family: "Roboto Condensed"; src: url("/assets/fonts/roboto-condensed-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Inter"; src: url("/assets/fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    :root {
      --paper: #f7f9fc; --ink: #0e2340; --muted: #53637c; --line: rgba(14, 35, 64, 0.14); --focus: #2b77bf;
      --gradient: linear-gradient(90deg, #0d2240 0%, #1a5297 48%, #2b77bf 74%, #1a8a6b 100%);
      --rule: linear-gradient(90deg, #1a5297, #1a8a6b);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #08121f; --ink: #eef3fa; --muted: #9aabc3; --line: rgba(238, 243, 250, 0.16); --focus: #8ec5f4;
        --gradient: linear-gradient(90deg, #cfe5fa 0%, #8ec5f4 45%, #7fd6be 100%);
        --rule: linear-gradient(90deg, #8ec5f4, #7fd6be);
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; background: var(--paper); color: var(--ink); font: 400 1.0625rem/1.6 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 34rem; }
    .code { width: fit-content; margin: 0 auto 1rem; background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; font: 700 clamp(4.5rem, 18vw, 8rem)/1 "Roboto Condensed", system-ui, sans-serif; letter-spacing: 0.02em; }
    h1, h2 { margin: 0; font-family: "Roboto Condensed", system-ui, sans-serif; font-weight: 600; line-height: 1.2; }
    h1 { font-size: 1.75rem; }
    h2 { font-size: 1.35rem; color: var(--muted); }
    p { margin: 0.5rem 0 0; color: var(--muted); }
    hr { width: 3rem; height: 2px; margin: 2rem auto; border: 0; background: var(--rule); }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; margin-top: 2.5rem; }
    .links a { padding: 0.75rem 1.25rem; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); font: 600 0.95rem/1.2 "Roboto Condensed", system-ui, sans-serif; text-decoration: none; }
    .links a:hover { border-color: #8fbfe8; }
    a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    @media (forced-colors: active) { .code { background: none; color: CanvasText; -webkit-text-fill-color: currentColor; } }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p>This page doesn’t exist or has moved.</p>
    <hr>
    <h2 lang="fr">Page introuvable</h2>
    <p lang="fr">Cette page n’existe pas ou a été déplacée.</p>
    <div class="links">
      <a href="/">Home page</a>
      <a href="/fr/" lang="fr" hreflang="fr">Page d’accueil</a>
    </div>
  </main>
</body>
</html>
