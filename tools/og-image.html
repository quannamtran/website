<!doctype html>
<html><head><meta charset="utf-8">
<!-- Share preview (share-en-2027.jpg / share-fr-2027.jpg, 1200x630). To regenerate: run "python3 -m http.server" at the site root,
     open /tools/og-image.html (add ?lang=fr for French) in a 1200x630 window and take a screenshot. -->
<style>
@font-face { font-family: "RC"; src: url("/assets/fonts/roboto-condensed-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Inter"; src: url("/assets/fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: "Inter"; color: #0e2340;
  background:
    radial-gradient(40% 60% at 10% 10%, rgba(120,178,232,.35), rgba(120,178,232,0) 70%),
    radial-gradient(35% 55% at 92% 88%, rgba(26,138,107,.16), rgba(26,138,107,0) 70%),
    linear-gradient(180deg, #dcebf8 0%, #f7f9fc 70%); }
.waves { position: absolute; inset: 40px -120px 20px 520px; background: url("/assets/img/waves-light.svg") center / contain no-repeat; opacity: .75;
  -webkit-mask-image: linear-gradient(90deg, transparent 5%, #000 40%); }
.text { position: absolute; left: 76px; top: 64px; width: 640px; }
.status { display: inline-flex; align-items: center; gap: 14px; color: #1a5297; font: 600 22px/1 "RC"; letter-spacing: .16em; text-transform: uppercase; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: #d17a22; box-shadow: 0 0 0 6px rgba(209,122,34,.18); }
.bar { width: 120px; height: 8px; background: #086151; margin: 34px 0 20px; }
h1 { font: 700 112px/0.95 "RC"; text-transform: uppercase; letter-spacing: .01em; }
h1 span { display: block; }
.grad { width: fit-content; background: linear-gradient(90deg, #0d2240 0%, #1a5297 48%, #2b77bf 74%, #1a8a6b 100%); -webkit-background-clip: text; color: transparent; }
.sub { margin-top: 22px; font: 400 36px/1.25 "RC"; color: #2b3d58; max-width: 560px; }
.by { margin-top: 20px; font: 600 22px/1 "RC"; letter-spacing: .2em; text-transform: uppercase; }
.site { position: absolute; left: 76px; bottom: 52px; font: 500 24px/1 "Inter"; color: #53637c; }
.book { position: absolute; right: 92px; top: 46px; width: 360px; transform: perspective(1600px) rotateY(-14deg); }
.book img { width: 100%; display: block; border-radius: 2px 6px 6px 2px;
  box-shadow: 0 2px 4px rgba(14,35,64,.12), 0 30px 50px -18px rgba(20,62,112,.5), 0 60px 90px -40px rgba(11,99,82,.4); }
</style></head>
<body>
  <div class="waves"></div>
  <div class="text">
    <p class="status"><span class="dot"></span><span id="status"></span></p>
    <div class="bar"></div>
    <h1><span>Augmenting</span><span class="grad">Decision</span></h1>
    <p class="sub" id="sub"></p>
    <p class="by" id="by"></p>
  </div>
  <p class="site">augmenting-decision.com</p>
  <div class="book"><img src="/assets/img/cover.webp" alt=""></div>
<script>
  var q = new URLSearchParams(location.search);
  var fr = q.get('lang') === 'fr';
  document.getElementById('status').textContent = fr ? 'Un nouveau livre · Parution en juin 2027' : 'A new book · Coming June 2027';
  document.getElementById('sub').textContent = fr ? 'Comment les données et l’IA transforment notre façon de choisir' : 'How data and AI are transforming the way we choose';
  document.getElementById('by').textContent = fr ? 'Par Antoine Tran Quan Nam' : 'By Antoine Tran Quan Nam';
</script>
</body></html>
