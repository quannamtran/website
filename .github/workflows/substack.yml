# Keeps the Substack page (substack.html, fr/substack.html) up to date from the publishing
# agent's repository, quannamtran/substack-post: the latest note every day at 11:07 UTC, and
# the new articles on Thursday and Sunday at 15:07 UTC (the agent publishes the free article
# on Thursday and the paid one on Sunday, around 14:20). Substack itself is never contacted.
# Needs the SUBSTACK_POST_TOKEN secret (see README). Run it by hand from the Actions tab:
# "Refresh Substack page" > "Run workflow" (that updates both the note and the articles).
name: Refresh Substack page

on:
  schedule:
    - cron: "7 11 * * *"     # every day at 11:07 UTC: the latest note
    - cron: "7 15 * * 0,4"   # Thursday and Sunday at 15:07 UTC: the new articles
  workflow_dispatch:
    inputs:
      post_url:
        description: "Optional: a post you published by hand (its Substack link)"
        required: false

permissions:
  contents: write

concurrency:
  group: substack-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUBSTACK_POST_TOKEN: ${{ secrets.SUBSTACK_POST_TOKEN }}
    steps:
      - name: Check the access key
        id: key
        run: |
          if [ -z "$SUBSTACK_POST_TOKEN" ]; then
            echo "::warning::The SUBSTACK_POST_TOKEN secret is missing, so the Substack page was not updated. See the README."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == 'true'

      - name: Get the agent's archive (articles and notes only)
        if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          repository: quannamtran/substack-post
          token: ${{ secrets.SUBSTACK_POST_TOKEN }}
          path: .agent
          persist-credentials: false
          sparse-checkout: |
            articles
            articles-paid
            articles-adhoc
            articles-adhoc-paid
            articles-handson
            Dossier
            notes/social
            notes-insight

      - uses: actions/setup-python@v6
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Install the picture library
        if: steps.key.outputs.ok == 'true'
        run: pip install --quiet pillow

      - name: Find the latest articles and note
        if: steps.key.outputs.ok == 'true'
        env:
          POST_URL: ${{ inputs.post_url }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$POST_URL" ]; then
            python tools/update-substack.py --agent .agent --add "$POST_URL"
          elif [ "$SCHEDULE" = "7 11 * * *" ]; then
            python tools/update-substack.py --agent .agent --only notes
          elif [ "$SCHEDULE" = "7 15 * * 0,4" ]; then
            python tools/update-substack.py --agent .agent --only articles
          else
            python tools/update-substack.py --agent .agent
          fi

      - name: Update the pages
        if: steps.key.outputs.ok == 'true'
        run: python tools/render-substack.py

      - name: Publish if anything changed
        if: steps.key.outputs.ok == 'true'
        run: |
          git add -A -- substack.html fr/substack.html assets/img
          if git diff --cached --quiet; then
            echo "Nothing new since the last update."
            exit 0
          fi
          git add -A -- assets/data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the Substack page"
          git push
