# Keeps the Substack page (substack.html, fr/substack.html) up to date:
# every day it fetches the latest note and posts, saves their pictures on the site,
# and publishes the page again if anything changed. Run it by hand from the
# Actions tab ("Refresh Substack page" > "Run workflow") to update right away.
name: Refresh Substack page

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: substack-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the picture library
        run: pip install --quiet pillow

      - name: Fetch the latest note and posts
        run: python tools/fetch-substack.py

      - name: Update the pages
        run: python tools/render-substack.py

      - name: Publish if anything changed
        run: |
          git add -A -- substack.html fr/substack.html assets/img
          if git diff --cached --quiet; then
            echo "Nothing new on Substack."
            exit 0
          fi
          git add -A -- assets/data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the Substack page"
          git push
