# Temporary: runs the Substack update once from this branch to see if Substack accepts it. Publishes nothing.
name: Substack probe (temporary)

on:
  push:
    branches: [claude/book-launch-website]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - run: python tools/fetch-substack.py --debug
      - run: python tools/render-substack.py
      - name: Show the result
        run: |
          cat assets/data/substack.json
          ls -la assets/img/substack || true
