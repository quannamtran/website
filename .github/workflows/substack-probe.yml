# Temporary: tries the Substack update on the real feed from this branch, without publishing anything.
name: Substack probe (temporary)

on:
  push:
    branches: [claude/book-launch-website]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - run: python tools/fetch-substack.py --debug
      - run: python tools/render-substack.py
      - name: Show the result
        run: |
          cat assets/data/substack.json
          ls -la assets/img/substack || true
          sed -n '/substack:note -->/,/\/substack:note -->/p' substack.html
          sed -n '/substack:posts -->/,/\/substack:posts -->/p' fr/substack.html | head -40
